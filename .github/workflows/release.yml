name: Release

# Every push to main is a release: v<version>.<build>, with the APK signed with the release key.
# The build is the number of commits, so each one is newer than the one before, and the tag is
# the app's versionName: that is what Obtainium and Android's installer go by.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every commit: they are counted
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: The version
        run: |
          build=$(git rev-list --count HEAD)
          version=$(sed -n 's/^kiwi\.version=//p' gradle.properties)
          echo "KIWI_BUILD=$build" >> "$GITHUB_ENV"
          echo "TAG=v$version.$build" >> "$GITHUB_ENV"

      - name: The release key
        env:
          KEYSTORE: ${{ secrets.KIWI_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::No release key: set the secrets KIWI_KEYSTORE, KIWI_KEYSTORE_PASSWORD, KIWI_KEY_ALIAS and KIWI_KEY_PASSWORD (README, Releases)."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          KIWI_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KIWI_KEYSTORE_PASSWORD: ${{ secrets.KIWI_KEYSTORE_PASSWORD }}
          KIWI_KEY_ALIAS: ${{ secrets.KIWI_KEY_ALIAS }}
          KIWI_KEY_PASSWORD: ${{ secrets.KIWI_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease test
          cp app/build/outputs/apk/release/app-release.apk kiwi-app.apk

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" kiwi-app.apk --clobber
          else
            gh release create "$TAG" kiwi-app.apk --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
          fi

      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
